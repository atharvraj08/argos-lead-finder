name: Daily feed collection

# Daily snapshot of shallow feeds (RSS/listing pages that only show recent
# items) so the weekly run does not miss events that scroll off mid-week.
on:
  schedule:
    - cron: "30 11 * * *" # 06:30 EST / 07:30 EDT
  workflow_dispatch:

permissions:
  contents: write

# Shared with weekly.yml so the two never overlap or race on data/argos.db.
concurrency:
  group: argos-db
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      SEATGEEK_CLIENT_ID: ${{ secrets.SEATGEEK_CLIENT_ID }}
      GMAIL_SENDER: ${{ secrets.GMAIL_SENDER }}
      GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      RESEND_FROM: ${{ secrets.RESEND_FROM }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Collect shallow feeds
        run: python -m argos_leads collect

      # Always runs (even after a failure) so whatever was collected persists.
      - name: Commit lead database
        if: always()
        run: |
          if [ ! -f data/argos.db ]; then echo "No database to commit."; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/argos.db
          if git diff --cached --quiet; then echo "Database unchanged."; exit 0; fi
          git commit -m "chore: update lead database [skip ci]"
          for attempt in 1 2 3; do
            if git pull --rebase && git push; then exit 0; fi
            echo "Push attempt $attempt failed; retrying."
            sleep $((attempt * 10))
          done
          exit 1

      - name: Email failure notice
        if: failure()
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python -m argos_leads notify-failure --message "${{ github.workflow }} run $RUN_URL failed"
